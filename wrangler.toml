name = "exp-worker" # forced to exp-<experiment>-<slug> by the publisher
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# USDC on Base mainnet is paid straight to the agent's treasury wallet.
PAY_TO = "0x528eB355837529314A28ab87a3A479Ad857e8698"
NETWORK = "eip155:8453"
# Market reference (x402scan, 2026-10): web read $0.002, email verification $0.001, enrichment $0.005+.
PRICE_READ = "$0.003"
PRICE_EMAIL = "$0.002"
# Bulk email validation: one call covers up to 100 addresses ($0.0001/address).
# Above the $0.002 single check, well below the $0.02 site-audit top price.
PRICE_EMAILS = "$0.01"
PRICE_DOMAIN = "$0.01"
# Speech to text, flat per file (max 20 MB): Workers AI Whisper costs ~$0.0005 per audio minute; market leader $0.40/call.
PRICE_TRANSCRIBE = "$0.03"
# Public facilitator: no account or API key; it sponsors gas. Free tier is capped by total settlements.
FACILITATOR_URL = "https://facilitator.payai.network"

[observability]
enabled = true
head_sampling_rate = 1
# Invocation logs would record "<METHOD> <URL>" including ?email= / ?url= values: off for privacy.
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
